name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app/build/outputs/apk/debug/app-debug.apk was not found!" >&2
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="UNISOC Tuner v1.0 (Build ${{ github.run_number }} Attempt ${{ github.run_attempt }})"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APK_FILENAME="$(basename "$APK_PATH")"

          echo "Attempting release publication with tag: $TAG_NAME..."

          if gh release create "$TAG_NAME" "$APK_PATH" \
              --title "$RELEASE_TITLE" \
              --target "${{ github.sha }}" \
              --latest \
              --notes "Automated Debug APK release for commit ${{ github.sha }} (Run #${{ github.run_number }}, Attempt #${{ github.run_attempt }}). The APK file is directly downloadable in the Assets section below."; then

            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            echo "Release publication succeeded!"
            echo "--- Release Confirmation ---"
            gh release view "$TAG_NAME"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $APK_FILENAME"

            echo "## 🚀 Release Publishing Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title:** $RELEASE_TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset Filename:** \`$APK_FILENAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Download Instructions:** The APK can be downloaded directly from the **Assets** section of the [GitHub Release page]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "🛡️ **Backup:** The normal Actions artifact (\`app-debug-apk\`) is also available as a backup under workflow run artifacts." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed!"
            echo "The APK build succeeded, but creating the GitHub Release failed."
            echo "The Actions artifact named app-debug-apk remains available for download."

            echo "## ⚠️ Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "- The APK build succeeded, but release publishing failed." >> "$GITHUB_STEP_SUMMARY"
            echo "- The Actions artifact named \`app-debug-apk\` remains available as a backup under the workflow run artifacts." >> "$GITHUB_STEP_SUMMARY"
            echo "- The workflow will not fail because the build itself was successful." >> "$GITHUB_STEP_SUMMARY"
          fi
